name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Postgres service containers below create the superuser `sauna` (migrations and tests only).
  DATABASE_URL: postgres://sauna:sauna@localhost:5432/sauna

jobs:
  # ------------------------------------------------------------------------------------------
  typecheck-unit:
    name: Typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck (tsc --noEmit in every workspace)
        run: npm run typecheck
      - name: Unit tests
        run: npx vitest run --project unit

  # ------------------------------------------------------------------------------------------
  db-api:
    name: Database + API tests (Postgres 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sauna
          POSTGRES_PASSWORD: sauna
          POSTGRES_DB: sauna
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sauna"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      LOCAL_IDP: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Database tests (schema, rules, RLS isolation)
        run: npx vitest run --project db
      - name: API integration tests
        run: npx vitest run --project api

  # ------------------------------------------------------------------------------------------
  build:
    name: Build (web + API bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Bundle sizes
        run: |
          {
            echo "API bundle: $(du -h services/api/dist/local.js | cut -f1)"
            echo "Web build: $(du -sh apps/web/dist | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------------------------------
  e2e:
    name: End-to-end (Playwright)
    needs: [typecheck-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sauna
          POSTGRES_PASSWORD: sauna
          POSTGRES_DB: sauna
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sauna"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      LOCAL_IDP: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # e2e/global-setup.ts builds the SPA, creates a fresh seeded database from DATABASE_URL
      # (createTestDatabase) and starts the local server against it; no db:reset needed.
      - name: Playwright
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ------------------------------------------------------------------------------------------
  audit:
    name: Dependency audit (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm audit --audit-level=high

  # ------------------------------------------------------------------------------------------
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gitleaks CLI in its official container (no licence needed, unlike the action).
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 \
            git /repo --redact --verbose --exit-code 1
